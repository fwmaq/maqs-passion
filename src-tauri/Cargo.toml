[package]
name = "maqs-passion"
version = "2.14.4"
description = "Maq's Passion — Fortnite Competitive Companion"
authors = ["maq"]
edition = "2021"

[lib]
name = "maqs_passion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }


tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "ee2c9775743c9962f7a1e800fb5e7b82b96597df", default-features = false, features = ["rustls-tls", "system-proxy"] }
